name: Secure Build and Deploy (Quartz 5 + Vector DB)

on:
  push:
    branches:
      - v5 # 对应您当前正在使用的 v5 分支
  repository_dispatch:
    types: [vault_update] # 响应来自 obsdata 的远程唤醒信号

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1.1 拉取当前的私有 Quartz 框架代码
      - name: Checkout Quartz Code
        uses: actions/checkout@v4
        with:
          path: 'quartz-app'
          persist-credentials: false # 保持关闭，防止凭证污染

      # 1.2 跨仓库拉取您的私有 Obsidian 笔记
      - name: Checkout Private Obsidian Notes
        uses: actions/checkout@v4
        with:
          repository: 'zengjuly/obsdata'
          token: ${{ secrets.VAULT_TOKEN }}
          fetch-depth: 0
          path: 'quartz-app/content'
          persist-credentials: false

      # 2. 编译 Quartz 静态网站
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'quartz-app/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd quartz-app
          npm ci

      - name: Build Quartz Site
        run: |
          cd quartz-app
          npx quartz build
      # 【完美修复版】精准清洗 HTML 标签属性，杜绝破坏底部 JS 混淆脚本
      - name: Normalize Dynamic Component IDs
        run: |
          echo "正在以精准匹配模式清洗 HTML 文件中的标签 ID..."
          
          # 1. 仅精准替换 HTML 标签中的 id="explorer-XX" 和 id="toc-XX"
          # 使用 [[:space:]] 作为边界保护，确保不触碰打包后的压缩 JS 代码
          find ./quartz-app/public -type f -name "*.html" -exec sed -i -E 's/id="explorer-[0-9]+"/id="explorer-static"/g' {} +
          find ./quartz-app/public -type f -name "*.html" -exec sed -i -E 's/id="toc-[0-9]+"/id="toc-static"/g' {} +
          
          # 2. 仅精准替换 HTML 标签中的 aria-controls="..."
          find ./quartz-app/public -type f -name "*.html" -exec sed -i -E 's/aria-controls="explorer-[0-9]+"/aria-controls="explorer-static"/g' {} +
          find ./quartz-app/public -type f -name "*.html" -exec sed -i -E 's/aria-controls="toc-[0-9]+"/aria-controls="toc-static"/g' {} +
          
          echo "清洗完成！正在进入后续构建..."
      # 3. 部署 Python 推理环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 与本地 venv 一致；onnxruntime==1.30.0 无 cp310 wheel（py3.10 装不上）

      - name: Install Python Dependencies
        # CI 修复：vector_tool/ 随主仓库 checkout 在 quartz-app/ 子目录下
        # （run 35403039327 实测：根目录无此文件，pip 直接失败断掉整条链）
        run: |
          cd quartz-app
          pip install -r vector_tool/requirements.txt

      # 3b. 向量 shard 缓存：kb_vec 已改为按**内容 hash** 增量（不再看 mtime
      #     ——CI 每次全新 checkout 的 mtime 都是新值，旧逻辑使增量永不命中，
      #     每轮全量重嵌约 22 分钟）。复用上轮 db 后只重嵌真正变化的文档。
      #     key 刻意**不含 obsdata 内容**：内容变化时仍命中旧缓存做增量；
      #     restore-keys 前缀匹配让 kb_vec.py/依赖变化时也能拿到旧 db 做增量
      #     （完全 miss 才会全量重建）。schema 变更时手工把 v1 升到 v2。
      - name: Cache Vector Shards
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vector-shards
          key: vector-shards-v1-${{ runner.os }}-${{ hashFiles('quartz-app/vector_tool/kb_vec.py', 'quartz-app/vector_tool/requirements.txt') }}
          restore-keys: |
            vector-shards-v1-${{ runner.os }}-

      # 4. 向量库构建：按领域拆分为多个小 sqlite（int8向量+gzip文本），
      #    产物 public/vector/<domain>.db + manifest.json，单库 KB~MB 级。
      #    替换旧 sync_vector.py（mock 向量 + 单文件全量下发）
      #    输出到 RUNNER_TEMP 而非 public/：.db 是中间产物（含 mtime 等
      #    每次构建必变的字段），留在 public 会让每个 db 每轮都进产物仓库。
      - name: Build Vector Shards
        run: |
          cd quartz-app
          if [ ! -f quartz.config.default.yaml ]; then
            echo "::warning::仓库缺少 Quartz 配置文件，跳过向量构建"
            exit 0
          fi
          python vector_tool/kb_vec.py shard \
            --vault "$GITHUB_WORKSPACE/quartz-app/content" \
            --out "$RUNNER_TEMP/vector-shards"

      # 4b. 前端检索包分发：把 shard 产物 + int8 模型 + tokenizer + ort wasm
      #     运行时统一拷进 public/vector-web/（前端插件 VEC_BASE 指向此目录）。
      #     --vault-prefix 必需：CI 里 kb_vec 写入的 doc_path 是 checkout 绝对
      #     路径（$GITHUB_WORKSPACE/.../content/...），归一为 vault 相对路径才能
      #     对上站点 URL，且防把构建机路径烤进公开站。
      - name: Emit Web Vector Pack
        run: |
          cd quartz-app
          python vector_tool/emit_web.py \
            --shards "$RUNNER_TEMP/vector-shards" \
            --models vector_tool/models \
            --out public/vector-web \
            --vault-prefix "$GITHUB_WORKSPACE/quartz-app/content" \
            --ort-dist node_modules/onnxruntime-web/dist


      # 10. 全自动将网页产物与向量库同步进新仓库
      #     【W1 修复】deploy-action 在 job 根目录跑 `git config user.name`，
      #     根目录无 git 仓库即 "fatal: not in a git directory"（persist-credentials:false
      #     且所有 checkout 都在子目录，根目录从未有 .git）。
      #     注意：不能用 actions/checkout 补根目录——checkout 默认 clean 会删掉
      #     未跟踪的 quartz-app/（连构建产物一起，run#12 实测）。
      #     改用 init + 空提交，单 commit 模式即可满足。
      - name: Init workspace-root git repo (fix deploy-action git dir)
        run: |
          git init -b main .
          git -c user.name="deploy-anchor" -c user.email="anchor@localhost" \
              commit --allow-empty -m "deploy anchor"

      - name: Deploy Production Output to Another Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.VAULT_TOKEN }}
          repository-name: zengjuly/quartz_out
          branch: main
          folder: ./quartz-app/public # 相对 runner 默认工作目录
          clean: true
          git-config-name: zengjuly
          target-folder: .

      # 10. 全自动将网页产物与向量库【真内容差异比对】后同步进新仓库
