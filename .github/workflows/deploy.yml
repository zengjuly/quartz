name: Secure Build and Deploy (Quartz 5 + Vector DB)

on:
  push:
    branches:
      - v5 # 对应您当前正在使用的 v5 分支
  repository_dispatch:
    types: [vault_update] # 响应来自 obsdata 的远程唤醒信号

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1.1 拉取当前的私有 Quartz 框架代码
      - name: Checkout Quartz Code
        uses: actions/checkout@v4
        with:
          path: 'quartz-app'
          persist-credentials: false # 保持关闭，防止凭证污染

      # 1.2 跨仓库拉取您的私有 Obsidian 笔记
      - name: Checkout Private Obsidian Notes
        uses: actions/checkout@v4
        with:
          repository: 'zengjuly/obsdata'
          token: ${{ secrets.VAULT_TOKEN }}
          fetch-depth: 0
          path: 'quartz-app/content'
          persist-credentials: false

      # 2. 编译 Quartz 静态网站
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'quartz-app/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd quartz-app
          npm ci

      - name: Build Quartz Site
        run: |
          cd quartz-app
          npx quartz build

      # 3. 部署 Python 推理环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install -r vector_tool/requirements.txt

      # 4. 向量库构建：按领域拆分为多个小 sqlite（int8向量+gzip文本），
      #    产物 public/vector/<domain>.db + manifest.json，单库 KB~MB 级。
      #    替换旧 sync_vector.py（mock 向量 + 单文件全量下发）
      - name: Build Vector Shards
        run: |
          cd quartz-app
          if [ ! -f quartz.config.default.yaml ]; then
            echo "::warning::仓库缺少 Quartz 配置文件，跳过向量构建"
            exit 0
          fi
          python vector_tool/kb_vec.py shard \
            --vault "$GITHUB_WORKSPACE/quartz-app/content" \
            --out "$GITHUB_WORKSPACE/quartz-app/public/vector"


      # 10. 全自动将网页产物与向量库同步进新仓库
      #     【W1 修复】deploy-action 在 job 根目录跑 `git config user.name`，
      #     根目录无 git 仓库即 "fatal: not in a git directory"（persist-credentials:false
      #     且所有 checkout 都在子目录，根目录从未有 .git）。
      #     注意：不能用 actions/checkout 补根目录——checkout 默认 clean 会删掉
      #     未跟踪的 quartz-app/（连构建产物一起，run#12 实测）。
      #     改用 init + 空提交，单 commit 模式即可满足。
      - name: Init workspace-root git repo (fix deploy-action git dir)
        run: |
          git init -b main .
          git -c user.name="deploy-anchor" -c user.email="anchor@localhost" \
              commit --allow-empty -m "deploy anchor"

      - name: Deploy Production Output to Another Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.VAULT_TOKEN }}
          repository-name: zengjuly/quartz_out
          branch: main
          folder: ./quartz-app/public # 相对 runner 默认工作目录
          clean: true
          git-config-name: zengjuly
          target-folder: .
