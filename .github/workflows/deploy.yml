name: Secure Build and Deploy (Quartz 5 + Vector DB)

on:
  push:
    branches:
      - v5 # 对应您当前正在使用的 v5 分支
  repository_dispatch:
    types: [vault_update] # 响应来自 obsdata 的远程唤醒信号

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1.1 拉取当前的私有 Quartz 框架代码
      - name: Checkout Quartz Code
        uses: actions/checkout@v4
        with:
          path: 'quartz-app'
          persist-credentials: false # 保持关闭，防止凭证污染

      # 1.2 跨仓库拉取您的私有 Obsidian 笔记
      - name: Checkout Private Obsidian Notes
        uses: actions/checkout@v4
        with:
          repository: 'zengjuly/obsdata'
          token: ${{ secrets.VAULT_TOKEN }}
          fetch-depth: 0 
          path: 'quartz-app/content'
          persist-credentials: false # 【修复点 1】必须同样设置为 false，否则会和下一步的部署 Token 冲突

      # 2. 编译 Quartz 静态网站
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'quartz-app/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd quartz-app
          npm ci

      - name: Build Quartz Site
        run: |
          cd quartz-app
          npx quartz build

      # 3. 部署 Python 推理环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install onnxruntime numpy

      # 4. 运行高效的本地【增量向量化】脚本
      - name: Generate Vector DB
        run: |
          cd quartz-app
          python sync_vector.py 

      # 10. 全自动将网页产物与向量库同步进新仓库
      - name: Deploy Production Output to Another Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.VAULT_TOKEN }}
          repository-name: zengjuly/quartz_out 
          branch: main                          
          folder: ./quartz-app/public # 【修复点 2】明确指定相对于根目录的产物路径
          clean: true                           
          git-config-name: zengjuly # 强制指定 Git 提交者名称，防止插件盲猜环境报错
